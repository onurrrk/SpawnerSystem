# ====================================================================================================
# Item spawners: spawners that produce an item instead of a mob.
# They are always in Auto Slayer mode (no mobs are spawned, the loot below is dropped directly).
#
# Give one with:  /sps givespawner <player> item <MATERIAL> [amount]   (e.g. /sps givespawner Steve item DIAMOND 5)
#
# Each key is a Material name. Add your own sections, the plugin never removes them.
# New default sections shipped with plugin updates are added automatically; the entries inside
# the "loot" list of a section you already have are never touched.
# ====================================================================================================

NETHERITE_INGOT:
  experience: 1
  loot:
    NETHERITE_INGOT:
      amount: 1-1
      chance: 100.0

