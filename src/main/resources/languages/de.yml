  booster-given-sender: "&#4ADE80%player% hat x%amount% Spawner-Booster-Ticket(s) erhalten."
  booster-given-recipient: "&#4ADE80Du hast x%amount% Spawner-Booster-Ticket(s) erhalten!"
  booster-applied: "&#4ADE80Spawner verstärkt! Reichweite +%range%, Spawn-Zeit -%delay% s, XP +%xp%%, Dauer: %duration%."
  booster-already-active: "&#F87171Dieser Spawner hat bereits einen aktiven Booster (noch %duration%)."
  booster-stack-limit: "&#F87171Dieser Spawner hat bereits die maximale Anzahl an Boostern (%max%)."
  booster-delay-too-high: "&#F87171Die Spawn-Verzögerung kann um höchstens %max% Sekunden verkürzt werden (minimale Spawn-Verzögerung: %min%s)."
