# ===============================
# Spawner System Sprachdatei
# ===============================

# Präfix für alle Plugin-Nachrichten
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# Spawner-Spitzhacke Einstellungen
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&lSpawner Spitzhacke"
  lore:
    - "&#9CA3AFBenutze diese Spitzhacke, um Spawner abzubauen."
    - "&#FFE066"
    - "&#4ADE80Verbleibende Nutzungen: &#F87171%uses%"

# =========================================
# Mod-Tags (Erweitert oder Klassisch)
# =========================================
mode-tags:
  advanced: "Spawner Spitzhacke"
  classic: "Behutsamkeit Spitzhacke"

# =========================================
# Spawner-Gegenstand Einstellungen
# =========================================
spawner-item:
  name: "&#4ADE80%type% Spawner"
  lore:
    - "&#9CA3AFPlatziere diesen Spawner, um Kreaturen zu spawnen."
    - "&#9CA3AFKann nur mit folgendem abgebaut werden: &#FFE066%mode%"
    - "&#9CA3AFEntity-Typ: &#4ADE80%type%"

# =========================================
# Spawner-Hologramm-Einstellungen
# =========================================
spawnable-status:
  - "&#4ADE80%type% Spawner"
  - "&#9CA3AFKann mit %mode% abgebaut werden"
  - "&#9CA3AFSchleichen und rechtsklicken, um das Menü zu öffnen"
  - "%status%"
  
can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# Mob-Hologramm-Einstellungen
# =========================================
mob-remove-warning:
  - "&#F87171Dieser Mob wird entfernt"
  - "&#FFE066Innerhalb von %time% s, wenn er das Gebiet nicht verlässt."
  
# =========================================
# Menü-Einstellungen (GUI)
# =========================================
menu:
  title: "&#6B7280Spawner-Kontrollzentrum"
  status:
    active: "&#4ADE80Aktiv ✔"
    inactive: "&#F87171Inaktiv ✖"
    
  items:
    auto-slayer:
      name: "&#F59E0B&lAutomatisches Töten"
      lore:
        - "&#9CA3AFTötet automatisch Kreaturen aus dem Spawner."
        - "&#9CA3AFSchaltet auch das Lager und den XP-Sauger ein."
        - "&#9CA3AFStatus: %status%"
        - ""
        - "&#F9FAFBLinksklick: &#FFE066Modus wechseln"
      lore-auto:
        - "&#9CA3AFTötet automatisch Kreaturen aus dem Spawner."
        - "&#9CA3AFLager und XP-Sauger sind immer eingeschaltet."
        - "&#9CA3AFStatus: %status%"
      lore-no-perm:
        - "&#9CA3AFTötet automatisch Kreaturen aus dem Spawner."
        - "&#9CA3AFStatus: %status%"
        - ""
        - "&#F87171&lDU KANNST DIESE FUNKTION NICHT NUTZEN"

    storage:
      name: "&#38BDF8&lLager"
      lore:
        - "&#9CA3AFVom Auto-Töter gesammelte Items werden hier aufbewahrt."
        - "&#9CA3AFBelegte Slots: &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#F9FAFBKlick: &#FFE066Lager öffnen"

    xp-vacuum:
      name: "&#4ADE80&lXP-Sammlung"
      click: "&#F9FAFBKlick: &#38BDF8XP abholen"
      lore:
        - "&#9CA3AFSpeichert XP von getöteten Kreaturen."
        - ""
        - "&#9CA3AFStatus: %status%"
        - "&#9CA3AFGesammelt: &#FFE066%xp% XP"
        - ""
        - "&#F9FAFBLinksklick: &#FFE066Modus wechseln"
        - "&#F9FAFBRechtsklick: &#38BDF8XP abholen"
      lore-no-perm:
        - "&#9CA3AFSpeichert XP von getöteten Kreaturen."
        - ""
        - "&#9CA3AFStatus: %status%"
        - "&#9CA3AFGesammelt: &#FFE066%xp% XP"
        - ""
        - "&#F87171&lDU KANNST DIESE FUNKTION NICHT NUTZEN"

  messages:
    no-permission: "&#F87171Du hast keine Berechtigung, diese Funktion zu ändern!"
    xp-empty: "&#F87171XP-Behälter ist leer!"
    xp-collected: "&#4ADE80Gesammelt: &#4ADE80%xp% XP!"
    req-auto-slayer: "&#F87171Aktiviere zuerst das automatische Töten!"
    feature-no-perm: "&#F87171Du hast keine Berechtigung, diese Funktion zu ändern!"
    perms-changed: "&#F87171Spawner-Funktionen wurden aufgrund geänderter Berechtigungen deaktiviert."
    storage-inventory-full: "&#F87171Dein Inventar ist voll!"
    storage-taken: "&#4ADE80%amount% Item(s) aus dem Lager genommen."
    in-use: "&#F87171Das Menü dieses Spawners wird gerade von jemand anderem benutzt."
  storage:
    title: "&#6B7280Spawner-Lager"
    previous:
      name: "&#F9FAFB&lVorherige Seite"
      lore:
        - "&#9CA3AFGehe zu Seite &#FFE066%page%&#9CA3AF"
    next:
      name: "&#F9FAFB&lNächste Seite"
      lore:
        - "&#9CA3AFGehe zu Seite &#FFE066%page%&#9CA3AF"
    take-page:
      name: "&#4ADE80&lSeite nehmen"
      lore:
        - "&#9CA3AFNimmt alle Items dieser Seite."
        - "&#9CA3AFItems können nicht zurückgelegt werden."
    back:
      name: "&#F87171&lZurück"
      lore:
        - "&#9CA3AFZurück zum Spawner-Menü."
    info:
      name: "&#38BDF8&lLager-Info"
      lore:
        - "&#9CA3AFSeite: &#FFE066%page%&#9CA3AF/&#FFE066%pages%"
        - "&#9CA3AFBelegte Slots: &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#9CA3AFKlicke auf ein Item, um es zu nehmen."
  
# =========================================
# Spawner-Booster Einstellungen
# =========================================
# Platzhalter: %range% %delay% %xp% %duration% (%index% im Info-Titel)
booster:
  item:
    name: "&#F59E0B&lSpawner-Booster"
    lore:
      - "&#9CA3AFRechtsklicke einen Spawner mit diesem Ticket, um ihn zu verstärken."
      - "&#FFE066Reichweite: &#F9FAFB+%range% Blöcke"
      - "&#FFE066Spawn-Zeit: &#F9FAFB-%delay% Sekunden"
      - "&#FFE066Mob-XP: &#F9FAFB+%xp%%"
      - "&#FFE066Dauer: &#F9FAFB%duration%"
  select:
    title: "&#6B7280Spawner wählen"
    entry: "&#FFE066&lSpawner #%index%"
    click: "&#F9FAFBKlick: &#FFE066Booster anwenden"
  time:
    unlimited: "Unbegrenzt"
    hour: "Std"
    minute: "Min"
    second: "Sek"
  info:
    name: "&#F59E0B&lAktive Booster"
    empty: "&#9CA3AFKein aktiver Booster."
    entry-title: "&#FFE066&lBooster #%index%"

# =========================================
# Plugin-Nachrichten
# =========================================
messages:
  no-permission: "&#F87171Du hast keine Berechtigung, diesen Befehl auszuführen."
  reload-success: "&#4ADE80Spawner-System Konfiguration erfolgreich neu geladen."
  wrong-subcommand: "&#FFE066Verwendung: /spsystem <reload|pickaxegive|givespawner|givebooster>"
  wrong-pickaxe-usage: "&#FFE066Verwendung: /spsystem pickaxegive <Spieler> <1-1000>"
  usage-givespawner: "&#FFE066Verwendung: /spsystem givespawner <Spieler> <mob|item> <type> [amount]"
  usage-givebooster:
    - "&#FFE066Verwendung: /spsystem givebooster <Spieler> <range> <delay-seconds> <xp-percent> <minutes|unlimited> [amount]"
    - "&#9CA3AF- &#F9FAFBrange&#9CA3AF: zusätzliche Blöcke für die Aktivierungsreichweite des Spawners"
    - "&#9CA3AF- &#F9FAFBdelay-seconds&#9CA3AF: Sekunden, die von der Spawn-Verzögerung abgezogen werden (0 = keine)"
    - "&#9CA3AF- &#F9FAFBxp-percent&#9CA3AF: zusätzliche Prozent der XP vom Spawner (0 = keine)"
    - "&#9CA3AF- &#F9FAFBminutes|unlimited&#9CA3AF: Dauer des Boosts in Minuten oder unlimited"
    - "&#9CA3AF- &#F9FAFBamount&#9CA3AF: Anzahl der Tickets (optional)"
