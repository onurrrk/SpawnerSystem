  invalid-item-spawner: "&#F87171Ungültiger Item-Spawner: %type%"
  booster-no-effect: "&#F87171Mindestens einer der Werte range, delay-seconds oder xp-percent muss größer als 0 sein."
  booster-disabled: "&#F87171Das Spawner-Booster-System ist deaktiviert. Setze 'spawner-booster.enabled: true' in der config.yml und führe /spsystem reload aus."
  command-disabled: "&#F87171Der Befehl 'pickaxegive' ist nur im 'erweiterten' Modus verfügbar."
  player-not-found: "&#F87171Spieler nicht gefunden: %player%"
