  booster-delay-partial: "&#FFE066Die Spawn-Verzögerung hat den niedrigsten Wert erreicht, daher wurden nur -%delay%s angewendet. Die anderen Effekte wurden angewendet."
  booster-delay-maxed-no-effect: "&#F87171Die Spawn-Verzögerung dieses Spawners ist bereits auf dem niedrigsten Wert. Das Ticket wurde nicht verbraucht."
  stack-merged: "&#4ADE80%amount% Spawner zusammengeführt. Stapel: %stack%/%max%."
  stack-full: "&#F87171Dieser Spawner-Stapel ist voll! (max. %max%)"
  stack-type-mismatch: "&#F87171Es können nur Spawner desselben Typs zusammengeführt werden!"
  stack-collected: "&#4ADE80%amount% Spawner erhalten. %left% verbleiben im Stapel."
  pickaxe-broken: "&#4ADE80Deine Spawner-Spitzhacke ist zerbrochen!"
  natural-spawner-break-denied: "&#F87171Natürliche Spawner sind geschützt und können nicht abgebaut werden."
