# =========================================
# Roghainnean Brosnachadh Spawner
# =========================================
# Luchd-ionaid: %range% %delay% %xp% %duration% (%index% ann an tiotal an fhiosrachaidh)
booster:
  item:
    name: "&#F59E0B&lBrosnachadh Spawner"
    lore:
      - "&#9CA3AFDèan briogadh deas air spawner leis an tiogaid seo gus a bhrosnachadh."
      - "&#FFE066Raon obrach: &#F9FAFB+%range% bloc"
      - "&#FFE066Ùine breith: &#F9FAFB-%delay% diog"
      - "&#FFE066XP mob: &#F9FAFB+%xp%%"
      - "&#FFE066Faid: &#F9FAFB%duration%"
  select:
    title: "&#6B7280Tagh spawner"
    entry: "&#FFE066&lSpawner #%index%"
    click: "&#F9FAFBBriog: &#FFE066Cuir booster an sàs"
  time:
    unlimited: "Gun chrìoch"
    hour: "u"
    minute: "m"
    second: "d"
  info:
    name: "&#F59E0B&lBrosnachaidhean gnìomhach"
    empty: "&#9CA3AFChan eil brosnachadh gnìomhach ann."
    entry-title: "&#FFE066&lBrosnachadh #%index%"

