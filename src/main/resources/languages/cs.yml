  spawner-given-sender: "&#4ADE80%player% obdržel %type% spawner."
  spawner-given-recipient: "&#38BDF8Obdrželi jste %type% spawner!"
  chunk-limit-exceeded: "&#F87171V tomto chunku nemůžeš umístit více spawnerů!"
