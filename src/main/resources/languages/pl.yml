  booster-delay-maxed: "&#FFE066Opóźnienie spawnu jest już na najniższym poziomie, więc część opóźnienia nie została zastosowana. Pozostałe efekty zastosowano."
  booster-delay-partial: "&#FFE066Opóźnienie spawnu osiągnęło najniższy poziom, więc zastosowano tylko -%delay% s. Pozostałe efekty zastosowano."
  booster-delay-maxed-no-effect: "&#F87171Opóźnienie spawnu tego spawnera jest już na najniższym poziomie. Bilet nie został zużyty."
  stack-merged: "&#4ADE80Połączono spawnerów: %amount%. Stos: %stack%/%max%."
  stack-full: "&#F87171Ten stos spawnerów jest pełny! (maks. %max%)"
