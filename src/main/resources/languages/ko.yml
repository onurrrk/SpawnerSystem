# ===============================
# Spawner 시스템 한국어
# ===============================

# 모든 플러그인 메시지의 접두사
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# Spawner 곡괭이 설정
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&lSpawner 곡괭이"
  lore:
    - "&#9CA3AF이 곡괭이를 사용하여 스포너를 부술 수 있습니다."
    - "&#FFE066"
    - "&#4ADE80남은 사용 횟수: &#F87171%uses%"

# =========================================
# 모드 태그 (고급 또는 일반)
# =========================================
mode-tags:
  advanced: "Spawner 곡괭이"
  classic: "실크터치 곡괭이"

# =========================================
# Spawner 아이템 설정
# =========================================
spawner-item:
  name: "&#4ADE80%type% 스포너"
  lore:
    - "&#9CA3AF이 스포너를 설치하여 몬스터를 소환하세요."
    - "&#9CA3AF다음으로만 부술 수 있음: &#FFE066%mode%"
    - "&#9CA3AF소환 몬스터 종류: &#4ADE80%type%"

# =========================================
# 스포너 홀로그램 설정
# =========================================
spawnable-status:
  - "&#4ADE80%type% 스포너"
  - "&#9CA3AF%mode%으로 부술 수 있음"
  - "&#9CA3AF웅크리고 우클릭하여 메뉴를 여세요"
  - "%status%"

can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# 몹 홀로그램 설정
# =========================================
mob-remove-warning:
  - "&#F87171이 몹은 제거됩니다"
  - "&#FFE066해당 지역을 떠나지 않으면 %time%초 내로."
  
