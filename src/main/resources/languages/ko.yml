# =========================================
# 스포너 강화 설정
# =========================================
# 플레이스홀더: %range% %delay% %xp% %duration% (정보 제목에서는 %index%)
booster:
  item:
    name: "&#F59E0B&l스포너 강화"
    lore:
      - "&#9CA3AF이 티켓으로 스포너를 우클릭하면 강화됩니다."
      - "&#FFE066작동 범위: &#F9FAFB+%range% 블록"
      - "&#FFE066소환 간격: &#F9FAFB-%delay%초"
      - "&#FFE066몹 경험치: &#F9FAFB+%xp%%"
      - "&#FFE066지속 시간: &#F9FAFB%duration%"
  select:
    title: "&#6B7280스포너 선택"
    entry: "&#FFE066&l스포너 #%index%"
    click: "&#F9FAFB클릭: &#FFE066부스터 적용"
  time:
    unlimited: "무제한"
    hour: "시간"
    minute: "분"
    second: "초"
  info:
    name: "&#F59E0B&l활성 강화"
    empty: "&#9CA3AF활성화된 강화가 없습니다."
    entry-title: "&#FFE066&l강화 #%index%"

