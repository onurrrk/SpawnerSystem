# ===============================
# Sistem Spawner Bahasa Indonesia
# ===============================

# Prefiks untuk semua pesan plugin
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# Pengaturan Kapak Spawner
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&lKapak Spawner"
  lore:
    - "&#9CA3AFGunakan kapak ini untuk memecah spawner."
    - "&#FFE066"
    - "&#4ADE80Penggunaan tersisa: &#F87171%uses%"

# =========================================
# Label Mode (Advanced atau Classic)
# =========================================
mode-tags:
  advanced: "Kapak Spawner"
  classic: "Kapak Sentuhan Sutra"

# =========================================
# Pengaturan Item Spawner
# =========================================
spawner-item:
  name: "&#4ADE80Spawner %type%"
  lore:
    - "&#9CA3AFTempatkan spawner ini untuk memunculkan monster."
    - "&#9CA3AFHanya bisa dihancurkan dengan: &#FFE066%mode%"
    - "&#9CA3AFJenis entitas: &#4ADE80%type%"

# =========================================
# Pengaturan Hologram Spawner
# =========================================
spawnable-status:
  - "&#4ADE80Spawner %type%"
  - "&#9CA3AFDapat dihancurkan dengan %mode%"
  - "&#9CA3AFBerjongkok dan klik kanan untuk membuka menu"
  - "%status%"

can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# Pengaturan Hologram Mob
# =========================================
mob-remove-warning:
  - "&#F87171Mob ini akan dihapus"
  - "&#FFE066Dalam %time% d jika tidak meninggalkan area."
  
# =========================================
# Pengaturan Menu (GUI)
# =========================================
menu:
  title: "&#6B7280Panel Kontrol Spawner"
  status:
    active: "&#4ADE80Aktif ✔"
    inactive: "&#F87171Tidak Aktif ✖"
    
  items:
    auto-slayer:
      name: "&#F59E0B&lPembunuh Otomatis"
      lore:
        - "&#9CA3AFMembunuh monster dari spawner secara otomatis."
        - "&#9CA3AFJuga mengaktifkan Penyimpanan dan Penyedot XP."
        - "&#9CA3AFStatus: %status%"
        - ""
        - "&#F9FAFBKlik Kiri: &#FFE066Ubah Mode"
      lore-auto:
        - "&#9CA3AFMembunuh monster dari spawner secara otomatis."
        - "&#9CA3AFPenyimpanan dan Penyedot XP selalu aktif."
        - "&#9CA3AFStatus: %status%"
      lore-no-perm:
        - "&#9CA3AFMembunuh monster dari spawner secara otomatis."
        - "&#9CA3AFStatus: %status%"
        - ""
        - "&#F87171&lKAMU TIDAK BISA MENGGUNAKAN FITUR INI"

    storage:
      name: "&#38BDF8&lPenyimpanan"
      lore:
        - "&#9CA3AFItem yang dikumpulkan Auto Slayer disimpan di sini."
        - "&#9CA3AFSlot terpakai: &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#F9FAFBKlik: &#FFE066Buka Penyimpanan"

    xp-vacuum:
      name: "&#4ADE80&lPengumpul XP"
      click: "&#F9FAFBKlik: &#38BDF8Ambil XP"
      lore:
        - "&#9CA3AFMenyimpan XP yang jatuh dari monster yang dibunuh."
        - ""
        - "&#9CA3AFStatus: %status%"
        - "&#9CA3AFTerkumpul: &#FFE066%xp% XP"
        - ""
        - "&#F9FAFBKlik Kiri: &#FFE066Ubah Mode"
        - "&#F9FAFBKlik Kanan: &#38BDF8Ambil XP"
      lore-no-perm:
        - "&#9CA3AFMenyimpan XP yang jatuh dari monster yang dibunuh."
        - ""
        - "&#9CA3AFStatus: %status%"
        - "&#9CA3AFTerkumpul: &#FFE066%xp% XP"
        - ""
        - "&#F87171&lKAMU TIDAK BISA MENGGUNAKAN FITUR INI"

  messages:
    no-permission: "&#F87171Kamu tidak punya izin untuk mengubah fitur ini!"
    xp-empty: "&#F87171Tangki XP kosong!"
    xp-collected: "&#4ADE80Terkumpul: &#4ADE80%xp% XP!"
    req-auto-slayer: "&#F87171Kamu harus mengaktifkan pembunuh otomatis terlebih dahulu!"
    feature-no-perm: "&#F87171Kamu tidak punya izin untuk mengubah fitur ini!"
    perms-changed: "&#F87171Fitur spawner telah dinonaktifkan karena perubahan izinmu."
    storage-inventory-full: "&#F87171Inventaris kamu penuh!"
    storage-taken: "&#4ADE80Mengambil %amount% item dari penyimpanan."
    in-use: "&#F87171Orang lain sedang menggunakan menu spawner ini."
  storage:
    title: "&#6B7280Penyimpanan Spawner"
    previous:
      name: "&#F9FAFB&lHalaman Sebelumnya"
      lore:
        - "&#9CA3AFKe halaman &#FFE066%page%&#9CA3AF"
    next:
      name: "&#F9FAFB&lHalaman Berikutnya"
      lore:
        - "&#9CA3AFKe halaman &#FFE066%page%&#9CA3AF"
    take-page:
      name: "&#4ADE80&lAmbil Halaman"
      lore:
        - "&#9CA3AFMengambil semua item di halaman ini."
        - "&#9CA3AFItem tidak dapat dikembalikan."
    back:
      name: "&#F87171&lKembali"
      lore:
        - "&#9CA3AFKembali ke menu spawner."
    info:
      name: "&#38BDF8&lInfo Penyimpanan"
      lore:
        - "&#9CA3AFHalaman: &#FFE066%page%&#9CA3AF/&#FFE066%pages%"
        - "&#9CA3AFSlot terpakai: &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#9CA3AFKlik item untuk mengambilnya."
  
# =========================================
# Pengaturan Penguat Spawner
# =========================================
# Placeholder: %range% %delay% %xp% %duration% (%index% pada judul info)
booster:
  item:
    name: "&#F59E0B&lPenguat Spawner"
    lore:
      - "&#9CA3AFKlik kanan spawner dengan tiket ini untuk memperkuatnya."
      - "&#FFE066Jangkauan kerja: &#F9FAFB+%range% blok"
      - "&#FFE066Jeda spawn: &#F9FAFB-%delay% detik"
      - "&#FFE066XP mob: &#F9FAFB+%xp%%"
      - "&#FFE066Durasi: &#F9FAFB%duration%"
  select:
    title: "&#6B7280Pilih Spawner"
    entry: "&#FFE066&lSpawner #%index%"
    click: "&#F9FAFBKlik: &#FFE066Terapkan Booster"
  time:
    unlimited: "Tanpa batas"
    hour: "j"
    minute: "mnt"
    second: "dtk"
  info:
    name: "&#F59E0B&lPenguat Aktif"
    empty: "&#9CA3AFTidak ada penguat aktif."
    entry-title: "&#FFE066&lPenguat #%index%"

# =========================================
# Pesan Plugin
# =========================================
messages:
  no-permission: "&#F87171Anda tidak memiliki izin untuk menggunakan perintah ini."
  reload-success: "&#4ADE80Konfigurasi Sistem Spawner berhasil dimuat ulang."
  wrong-subcommand: "&#FFE066Gunakan: /spsystem <reload|pickaxegive|givespawner|givebooster>"
  wrong-pickaxe-usage: "&#FFE066Gunakan: /spsystem pickaxegive <pemain> <1-1000>"
  usage-givespawner: "&#FFE066Gunakan: /spsystem givespawner <pemain> <mob|item> <type> [amount]"
