    - "&#9CA3AF- &#F9FAFBminutes|unlimited&#9CA3AF: lama boost dalam menit, atau unlimited"
    - "&#9CA3AF- &#F9FAFBamount&#9CA3AF: jumlah tiket yang diberikan (opsional)"
