    storage:
      name: "&#38BDF8&lΑποθήκη"
      lore:
        - "&#9CA3AFΤα αντικείμενα που συλλέγει ο Auto Slayer φυλάσσονται εδώ."
        - "&#9CA3AFΧρησιμοποιούμενες θέσεις: &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#F9FAFBΚλικ: &#FFE066Άνοιγμα αποθήκης"

    xp-vacuum:
      name: "&#4ADE80&lΣυλλογή XP"
      click: "&#F9FAFBΚλικ: &#38BDF8Ανάληψη XP"
      lore:
        - "&#9CA3AFΑποθηκεύει XP από σκοτωμένα πλάσματα."
        - ""
        - "&#9CA3AFΚατάσταση: %status%"
        - "&#9CA3AFΣυλλεχθέντα: &#FFE066%xp% XP"
        - ""
        - "&#F9FAFBΑριστερό κλικ: &#FFE066Αλλαγή λειτουργίας"
        - "&#F9FAFBΔεξί κλικ: &#38BDF8Ανάληψη XP"
      lore-no-perm:
        - "&#9CA3AFΑποθηκεύει XP από σκοτωμένα πλάσματα."
        - ""
        - "&#9CA3AFΚατάσταση: %status%"
        - "&#9CA3AFΣυλλεχθέντα: &#FFE066%xp% XP"
        - ""
        - "&#F87171&lΔΕΝ ΜΠΟΡΕΙΤΕ ΝΑ ΧΡΗΣΙΜΟΠΟΙΗΣΕΤΕ ΑΥΤΗ ΤΗ ΛΕΙΤΟΥΡΓΙΑ"

  messages:
    no-permission: "&#F87171Δεν έχετε άδεια να αλλάξετε αυτή τη λειτουργία!"
    xp-empty: "&#F87171Η δεξαμενή XP είναι άδεια!"
    xp-collected: "&#4ADE80Συλλέχθηκαν: &#4ADE80%xp% XP!"
    req-auto-slayer: "&#F87171Πρέπει πρώτα να ενεργοποιήσετε την αυτόματη θανάτωση!"
    feature-no-perm: "&#F87171Δεν έχετε άδεια να αλλάξετε αυτή τη λειτουργία!"
    perms-changed: "&#F87171Οι λειτουργίες spawner απενεργοποιήθηκαν λόγω αλλαγής των δικαιωμάτων σας."
    storage-inventory-full: "&#F87171Το inventory σου είναι γεμάτο!"
    storage-taken: "&#4ADE80Πήρες %amount% αντικείμενο(α) από την αποθήκη."
    in-use: "&#F87171Κάποιος άλλος χρησιμοποιεί αυτή τη στιγμή το μενού αυτού του spawner."
  storage:
