# ===============================
# Spawner System Ελληνικά
# ===============================

# Πρόθεμα για όλα τα μηνύματα του plugin
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# Ρυθμίσεις Τσεκούρι Spawner
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&lSpawner Τσεκούρι"
  lore:
    - "&#9CA3AFΧρησιμοποιήστε αυτό το τσεκούρι για να σπάσετε το spawner."
    - "&#FFE066"
    - "&#4ADE80Υπόλοιπες χρήσεις: &#F87171%uses%"

# =========================================
# Ετικέτες λειτουργίας (Προχωρημένο ή Κλασικό)
# =========================================
mode-tags:
  advanced: "Spawner Τσεκούρι"
  classic: "Τσεκούρι Μεταξωτής Αφή"

# =========================================
# Ρυθμίσεις Αντικειμένου Spawner
# =========================================
spawner-item:
  name: "&#4ADE80%type% Spawner"
  lore:
    - "&#9CA3AFΤοποθετήστε αυτό το spawner για να εμφανίσετε τέρατα."
    - "&#9CA3AFΜπορεί να σπάσει μόνο με: &#FFE066%mode%"
    - "&#9CA3AFΤύπος οντότητας: &#4ADE80%type%"

# =========================================
# Ρυθμίσεις Χologram Spawner
# =========================================
spawnable-status:
  - "&#4ADE80%type% Spawner"
  - "&#9CA3AFΜπορεί να καταστραφεί με %mode%"
  - "&#9CA3AFΣκύψτε και κάντε δεξί κλικ για να ανοίξετε το μενού"
  - "%status%"

can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# Ρυθμίσεις Ολογράμματος Mob
# =========================================
mob-remove-warning:
  - "&#F87171Αυτό το mob θα αφαιρεθεί"
  - "&#FFE066Μέσα σε %time% δευτερόλεπτα αν δεν φύγει από την περιοχή."
  
# =========================================
# Ρυθμίσεις Μενού (GUI)
# =========================================
menu:
  title: "&#6B7280Πίνακας Ελέγχου Spawner"
  status:
    active: "&#4ADE80Ενεργό ✔"
    inactive: "&#F87171Ανενεργό ✖"
    
  items:
    auto-slayer:
      name: "&#F59E0B&lΑυτόματη Θανάτωση"
      lore:
        - "&#9CA3AFΘανατώνει αυτόματα πλάσματα από το spawner."
        - "&#9CA3AFΕνεργοποιεί επίσης την Αποθήκη και τον Συλλέκτη XP."
        - "&#9CA3AFΚατάσταση: %status%"
        - ""
        - "&#F9FAFBΑριστερό κλικ: &#FFE066Αλλαγή λειτουργίας"
      lore-auto:
        - "&#9CA3AFΘανατώνει αυτόματα πλάσματα από το spawner."
        - "&#9CA3AFΗ Αποθήκη και ο Συλλέκτης XP είναι πάντα ενεργοί."
        - "&#9CA3AFΚατάσταση: %status%"
