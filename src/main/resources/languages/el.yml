# =========================================
# Ρυθμίσεις ενίσχυσης spawner
# =========================================
# Μεταβλητές: %range% %delay% %xp% %duration% (%index% στον τίτλο πληροφοριών)
booster:
  item:
    name: "&#F59E0B&lΕνίσχυση Spawner"
    lore:
      - "&#9CA3AFΚάντε δεξί κλικ σε ένα spawner με αυτό το εισιτήριο για να το ενισχύσετε."
      - "&#FFE066Εμβέλεια: &#F9FAFB+%range% μπλοκ"
      - "&#FFE066Χρόνος εμφάνισης: &#F9FAFB-%delay% δευτερόλεπτα"
      - "&#FFE066XP mob: &#F9FAFB+%xp%%"
      - "&#FFE066Διάρκεια: &#F9FAFB%duration%"
  select:
    title: "&#6B7280Επιλογή spawner"
    entry: "&#FFE066&lSpawner #%index%"
    click: "&#F9FAFBΚλικ: &#FFE066Εφαρμογή booster"
  time:
    unlimited: "Απεριόριστη"
    hour: "ω"
    minute: "λ"
    second: "δ"
  info:
    name: "&#F59E0B&lΕνεργές ενισχύσεις"
    empty: "&#9CA3AFΚαμία ενεργή ενίσχυση."
    entry-title: "&#FFE066&lΕνίσχυση #%index%"

