# ===============================
# Spawner System 日本語 (Japanese)
# ===============================

# プラグインメッセージの接頭辞
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# スポナーピッケルの設定
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&lスポナーピッケル"
  lore:
    - "&#9CA3AFスポナーを壊すにはこのピッケルを使ってください。"
    - "&#FFE066"
    - "&#4ADE80残り使用回数: &#F87171%uses%"

# =========================================
# モードタグ（高度またはクラシック）
# =========================================
mode-tags:
  advanced: "スポナーピッケル"
  classic: "シルクタッチのピッケル"

# =========================================
# スポナーアイテム設定
# =========================================
spawner-item:
  name: "&#4ADE80%type% スポナー"
  lore:
    - "&#9CA3AFこのスポナーを置くとモンスターを生成します。"
    - "&#9CA3AF以下でのみ破壊可能: &#FFE066%mode%"
    - "&#9CA3AFモンスターの種類: &#4ADE80%type%"

# =========================================
# スポナー ホログラム設定
# =========================================
spawnable-status:
  - "&#4ADE80%type% スポナー"
  - "&#9CA3AF%mode% で壊すことができます"
  - "&#9CA3AFしゃがんで右クリックでメニューを開きます"
  - "%status%"

can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# モブ ホログラム設定
# =========================================
mob-remove-warning:
  - "&#F87171このモブは削除されます"
  - "&#FFE066エリアから出ない場合、%time%秒以内に"
  
# =========================================
# メニュー設定 (GUI)
# =========================================
menu:
  title: "&#6B7280スポナーコントロールパネル"
  status:
    active: "&#4ADE80アクティブ ✔"
    inactive: "&#F87171非アクティブ ✖"
    
  items:
    auto-slayer:
      name: "&#F59E0B&lオートキラー"
      lore:
        - "&#9CA3AFスポナーから出てくるモブを自動で倒します。"
        - "&#9CA3AFストレージとXP吸引も自動でオンになります。"
        - "&#9CA3AF状態: %status%"
        - ""
        - "&#F9FAFB左クリック: &#FFE066モード切り替え"
      lore-auto:
        - "&#9CA3AFスポナーから出てくるモブを自動で倒します。"
        - "&#9CA3AFストレージとXP吸引は常にオンです。"
        - "&#9CA3AF状態: %status%"
      lore-no-perm:
        - "&#9CA3AFスポナーから出てくるモブを自動で倒します。"
        - "&#9CA3AF状態: %status%"
        - ""
        - "&#F87171&lこの機能は使用できません"

    storage:
      name: "&#38BDF8&lストレージ"
      lore:
        - "&#9CA3AFオートスレイヤーで集めたアイテムはここに保管されます。"
        - "&#9CA3AF使用スロット： &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#F9FAFBクリック： &#FFE066ストレージを開く"

    xp-vacuum:
      name: "&#4ADE80&lXP回収機"
      click: "&#F9FAFBクリック： &#38BDF8XPを引き出す"
      lore:
        - "&#9CA3AF倒したモブからドロップしたXPを貯めます。"
        - ""
        - "&#9CA3AF状態: %status%"
        - "&#9CA3AF貯まったXP: &#FFE066%xp% XP"
        - ""
        - "&#F9FAFB左クリック: &#FFE066モード切り替え"
        - "&#F9FAFB右クリック: &#38BDF8XPを引き出す"
      lore-no-perm:
        - "&#9CA3AF倒したモブからドロップしたXPを貯めます。"
        - ""
        - "&#9CA3AF状態: %status%"
        - "&#9CA3AF貯まったXP: &#FFE066%xp% XP"
        - ""
        - "&#F87171&lこの機能は使用できません"

  messages:
    no-permission: "&#F87171この機能を変更する権限がありません！"
    xp-empty: "&#F87171XPタンクは空です！"
    xp-collected: "&#4ADE80回収しました: &#4ADE80%xp% XP！"
    req-auto-slayer: "&#F87171最初にオートキラーを有効にしてください！"
    feature-no-perm: "&#F87171この機能を変更する権限がありません！"
    perms-changed: "&#F87171権限が変更されたため、スポナー機能は無効になりました。"
    storage-inventory-full: "&#F87171インベントリがいっぱいです！"
    storage-taken: "&#4ADE80ストレージからアイテムを %amount% 個取り出しました。"
    in-use: "&#F87171このスポナーのメニューは現在ほかのプレイヤーが使用中です。"
  storage:
    title: "&#6B7280スポナーストレージ"
    previous:
      name: "&#F9FAFB&l前のページ"
      lore:
        - "&#9CA3AF&#FFE066%page%&#9CA3AF ページへ移動"
    next:
      name: "&#F9FAFB&l次のページ"
      lore:
        - "&#9CA3AF&#FFE066%page%&#9CA3AF ページへ移動"
    take-page:
      name: "&#4ADE80&lページを取る"
      lore:
        - "&#9CA3AFこのページのすべてのアイテムを取り出します。"
        - "&#9CA3AFアイテムは戻せません。"
    back:
      name: "&#F87171&l戻る"
      lore:
        - "&#9CA3AFスポナーメニューに戻ります。"
    info:
      name: "&#38BDF8&lストレージ情報"
      lore:
        - "&#9CA3AFページ： &#FFE066%page%&#9CA3AF/&#FFE066%pages%"
        - "&#9CA3AF使用スロット： &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#9CA3AFアイテムをクリックして取り出します。"
  
# =========================================
# スポナー強化の設定
# =========================================
# プレースホルダー：%range% %delay% %xp% %duration%（情報タイトルでは %index%）
booster:
  item:
    name: "&#F59E0B&lスポナー強化チケット"
    lore:
      - "&#9CA3AFこのチケットでスポナーを右クリックすると強化されます。"
      - "&#FFE066稼働範囲：&#F9FAFB+%range% ブロック"
      - "&#FFE066出現間隔：&#F9FAFB-%delay% 秒"
      - "&#FFE066モブの経験値：&#F9FAFB+%xp%%"
      - "&#FFE066期間：&#F9FAFB%duration%"
  select:
    title: "&#6B7280スポナーを選択"
    entry: "&#FFE066&lスポナー #%index%"
    click: "&#F9FAFBクリック： &#FFE066ブースターを使う"
  time:
    unlimited: "無期限"
    hour: "時間"
    minute: "分"
    second: "秒"
  info:
    name: "&#F59E0B&l有効な強化"
    empty: "&#9CA3AF有効な強化はありません。"
    entry-title: "&#FFE066&l強化 #%index%"

# =========================================
# プラグインメッセージ
# =========================================
messages:
  no-permission: "&#F87171このコマンドを実行する権限がありません。"
  reload-success: "&#4ADE80Spawner システムの設定を正常に再読み込みしました。"
  wrong-subcommand: "&#FFE066使用法: /spsystem <reload|pickaxegive|givespawner|givebooster>"
  wrong-pickaxe-usage: "&#FFE066使用法: /spsystem pickaxegive <プレイヤー> <1-1000>"
  usage-givespawner: "&#FFE066使用法: /spsystem givespawner <プレイヤー> <mob|item> <type> [amount]"
  usage-givebooster:
    - "&#FFE066使用法: /spsystem givebooster <プレイヤー> <range> <delay-seconds> <xp-percent> <minutes|unlimited> [amount]"
    - "&#9CA3AF- &#F9FAFBrange&#9CA3AF: スポナーの起動範囲に追加するブロック数"
    - "&#9CA3AF- &#F9FAFBdelay-seconds&#9CA3AF: スポーン間隔から引く秒数 (0 = なし)"
    - "&#9CA3AF- &#F9FAFBxp-percent&#9CA3AF: スポナーのXPに追加する割合(%) (0 = なし)"
    - "&#9CA3AF- &#F9FAFBminutes|unlimited&#9CA3AF: ブーストの持続時間(分)、または unlimited"
    - "&#9CA3AF- &#F9FAFBamount&#9CA3AF: 配布するチケットの枚数 (省略可)"
    - "&#FFE066例: &#F9FAFB/spsystem givebooster プレイヤー 10 5 50 30 &#9CA3AF(範囲+10ブロック、間隔-5秒、XP+50%、30分間)"
  invalid-mob-type: "&#F87171無効なモブの種類: %type%"
  invalid-item-spawner: "&#F87171無効なアイテムスポナー: %type%"
  booster-no-effect: "&#F87171range、delay-seconds、xp-percent のうち少なくとも1つは0より大きくする必要があります。"
  booster-disabled: "&#F87171スポナーブースターシステムは無効です。config.yml で 'spawner-booster.enabled: true' に設定し、/spsystem reload を実行してください。"
  command-disabled: "&#F87171'pickaxegive' コマンドは 'advanced' モードでのみ使用可能です。"
