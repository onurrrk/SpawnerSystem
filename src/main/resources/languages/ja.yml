  booster-delay-partial: "&#FFE066スポーン間隔が最低レベルに達したため、-%delay%秒のみ適用されました。他の効果は適用されました。"
  booster-delay-maxed-no-effect: "&#F87171このスポナーのスポーン間隔はすでに最低レベルです。チケットは使用されませんでした。"
  stack-merged: "&#4ADE80スポナーを %amount% 個統合しました。スタック：%stack%/%max%。"
