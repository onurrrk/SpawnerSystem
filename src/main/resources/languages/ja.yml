  pickaxe-given-recipient: "&#38BDF8特別なスポナーピッケルを受け取りました！"
  spawner-collected: "&#4ADE80スポナーがインベントリに正常に追加されました！"
  spawner-break-lost: "&#F87171スポナーは破壊時に消えました！（回収確率：%chance%%）"
  spawner-break-no-chance: "&#F87171スポナーは消えました！あなたにはスポナーを回収できる確率がありません。"
  booster-given-sender: "&#4ADE80%player% にスポナー強化チケットを x%amount% 枚渡しました。"
  booster-given-recipient: "&#4ADE80スポナー強化チケットを x%amount% 枚受け取りました！"
  booster-applied: "&#4ADE80スポナーを強化しました！範囲 +%range%、出現間隔 -%delay% 秒、経験値 +%xp%%、期間：%duration%。"
  booster-already-active: "&#F87171このスポナーにはすでに有効な強化があります（残り %duration%）。"
