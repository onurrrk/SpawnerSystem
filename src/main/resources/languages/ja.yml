  spawner-given-sender: "&#4ADE80%player% に %type% スポナーを付与しました。"
  spawner-given-recipient: "&#38BDF8%type% スポナーを受け取りました！"
  chunk-limit-exceeded: "&#F87171このチャンクにはこれ以上スポナーを設置できません!"
