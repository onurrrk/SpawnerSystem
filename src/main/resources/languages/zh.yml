    - "&#9CA3AF- &#F9FAFBminutes|unlimited&#9CA3AF: 加成持续的分钟数,或 unlimited"
    - "&#9CA3AF- &#F9FAFBamount&#9CA3AF: 发放的票券数量 (可选)"
    - "&#FFE066示例: &#F9FAFB/spsystem givebooster 玩家 10 5 50 30 &#9CA3AF(范围+10格、延迟-5秒、经验+50%、持续30分钟)"
  invalid-mob-type: "&#F87171无效的生物类型: %type%"
