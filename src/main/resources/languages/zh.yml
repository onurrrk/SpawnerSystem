# ===============================
# Spawner System 简体中文 (Chinese)
# ===============================

# 插件消息前缀
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# 刷怪笼镐设置
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&l刷怪笼镐"
  lore:
    - "&#9CA3AF使用此镐来破坏刷怪笼。"
    - "&#FFE066"
    - "&#4ADE80剩余使用次数: &#F87171%uses%"

# =========================================
# 模式标签（高级或经典）
# =========================================
mode-tags:
  advanced: "刷怪笼镐"
  classic: "丝触镐"

# =========================================
# 刷怪笼物品设置
# =========================================
spawner-item:
  name: "&#4ADE80%type% 刷怪笼"
  lore:
    - "&#9CA3AF放置此刷怪笼以生成怪物。"
    - "&#9CA3AF只能使用: &#FFE066%mode% 来破坏"
    - "&#9CA3AF怪物类型: &#4ADE80%type%"

# =========================================
# 刷怪笼全息显示设置
# =========================================
spawnable-status:
  - "&#4ADE80%type% 刷怪笼"
  - "&#9CA3AF可用 %mode% 破坏"
  - "&#9CA3AF蹲下并右键单击以打开菜单"
  - "%status%"

can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# 生物全息显示设置
# =========================================
mob-remove-warning:
  - "&#F87171此生物将被移除"
  - "&#FFE066如果在 %time% 秒内不离开该区域。"
  
# =========================================
# 菜单设置 (GUI)
# =========================================
menu:
  title: "&#6B7280刷怪笼控制面板"
  status:
    active: "&#4ADE80开启 ✔"
    inactive: "&#F87171关闭 ✖"
    
  items:
    auto-slayer:
      name: "&#F59E0B&l自动击杀"
      lore:
        - "&#9CA3AF自动击杀刷怪笼生成的生物。"
        - "&#9CA3AF同时开启仓库和经验吸收。"
        - "&#9CA3AF状态: %status%"
        - ""
        - "&#F9FAFB左键点击: &#FFE066切换模式"
      lore-auto:
        - "&#9CA3AF自动击杀刷怪笼生成的生物。"
        - "&#9CA3AF仓库和经验吸收始终开启。"
        - "&#9CA3AF状态: %status%"
      lore-no-perm:
        - "&#9CA3AF自动击杀刷怪笼生成的生物。"
        - "&#9CA3AF状态: %status%"
        - ""
        - "&#F87171&l你不能使用此功能"

    storage:
      name: "&#38BDF8&l仓库"
      lore:
        - "&#9CA3AF自动击杀收集到的物品会存放在这里。"
        - "&#9CA3AF已用格数： &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#F9FAFB点击： &#FFE066打开仓库"

    xp-vacuum:
      name: "&#4ADE80&l经验收集"
      click: "&#F9FAFB点击： &#38BDF8提取经验"
      lore:
        - "&#9CA3AF储存被击杀生物掉落的经验值。"
        - ""
        - "&#9CA3AF状态: %status%"
        - "&#9CA3AF已收集: &#FFE066%xp% 经验"
        - ""
        - "&#F9FAFB左键点击: &#FFE066切换模式"
        - "&#F9FAFB右键点击: &#38BDF8取出经验"
      lore-no-perm:
        - "&#9CA3AF储存被击杀生物掉落的经验值。"
        - ""
        - "&#9CA3AF状态: %status%"
        - "&#9CA3AF已收集: &#FFE066%xp% 经验"
        - ""
        - "&#F87171&l你不能使用此功能"

  messages:
    no-permission: "&#F87171你没有权限更改此功能！"
    xp-empty: "&#F87171经验罐是空的！"
    xp-collected: "&#4ADE80已收集: &#4ADE80%xp% 经验！"
    req-auto-slayer: "&#F87171你必须先开启自动击杀！"
    feature-no-perm: "&#F87171你没有权限更改此功能！"
    perms-changed: "&#F87171由于你的权限发生变化，刷怪笼功能已被禁用。"
    storage-inventory-full: "&#F87171你的背包已满！"
    storage-taken: "&#4ADE80已从仓库取出 %amount% 个物品。"
    in-use: "&#F87171其他玩家正在使用这个刷怪笼的菜单。"
  storage:
    title: "&#6B7280刷怪笼仓库"
    previous:
      name: "&#F9FAFB&l上一页"
      lore:
        - "&#9CA3AF前往第 &#FFE066%page%&#9CA3AF 页"
    next:
      name: "&#F9FAFB&l下一页"
      lore:
        - "&#9CA3AF前往第 &#FFE066%page%&#9CA3AF 页"
    take-page:
      name: "&#4ADE80&l取出本页"
      lore:
        - "&#9CA3AF取出本页的所有物品。"
        - "&#9CA3AF物品无法放回。"
    back:
      name: "&#F87171&l返回"
      lore:
        - "&#9CA3AF返回刷怪笼菜单。"
    info:
      name: "&#38BDF8&l仓库信息"
      lore:
        - "&#9CA3AF页码： &#FFE066%page%&#9CA3AF/&#FFE066%pages%"
        - "&#9CA3AF已用格数： &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#9CA3AF点击物品即可取出。"
  
# =========================================
# 刷怪笼强化设置
# =========================================
# 占位符：%range% %delay% %xp% %duration%（信息标题中使用 %index%）
booster:
  item:
    name: "&#F59E0B&l刷怪笼强化券"
    lore:
      - "&#9CA3AF手持此券右键刷怪笼即可强化。"
      - "&#FFE066工作范围：&#F9FAFB+%range% 格"
      - "&#FFE066刷新间隔：&#F9FAFB-%delay% 秒"
      - "&#FFE066生物经验：&#F9FAFB+%xp%%"
      - "&#FFE066持续时间：&#F9FAFB%duration%"
  select:
    title: "&#6B7280选择刷怪笼"
    entry: "&#FFE066&l刷怪笼 #%index%"
    click: "&#F9FAFB点击： &#FFE066使用增益券"
  time:
    unlimited: "无限"
    hour: "小时"
    minute: "分钟"
    second: "秒"
  info:
    name: "&#F59E0B&l生效中的强化"
    empty: "&#9CA3AF没有生效的强化。"
    entry-title: "&#FFE066&l强化 #%index%"

# =========================================
# 插件消息
# =========================================
messages:
  no-permission: "&#F87171您没有权限使用此命令。"
  reload-success: "&#4ADE80Spawner 系统配置已成功重新加载。"
  wrong-subcommand: "&#FFE066用法: /spsystem <reload|pickaxegive|givespawner|givebooster>"
