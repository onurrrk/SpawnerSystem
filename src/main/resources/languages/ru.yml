  pickaxe-given-sender: "&#4ADE80Игроку %player% выдана кирка спавнера с %uses% использованиями."
  pickaxe-given-recipient: "&#38BDF8Вы получили особую кирку спавнера!"
  spawner-collected: "&#4ADE80Спавнер успешно добавлен в инвентарь!"
  spawner-break-lost: "&#F87171Спавнер исчез при разрушении! (Шанс сохранить: %chance%%)"
