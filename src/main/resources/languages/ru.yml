# ===============================
# Spawner System Русский (Russian)
# ===============================

# Префикс для всех сообщений
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# Настройки кирки для спавнера
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&lКирка Спавнера"
  lore:
    - "&#9CA3AFИспользуйте эту кирку, чтобы сломать спавнер."
    - "&#FFE066"
    - "&#4ADE80Осталось использований: &#F87171%uses%"

# =========================================
# Метки режима (advanced / classic)
# =========================================
mode-tags:
  advanced: "Кирка Спавнера"
  classic: "Кирка с шелковым прикосновением"

# =========================================
# Настройки предмета спавнера
# =========================================
spawner-item:
  name: "&#4ADE80%type% Спавнер"
  lore:
    - "&#9CA3AFПоместите этот спавнер, чтобы спаунить монстров."
    - "&#9CA3AFМожно сломать только с: &#FFE066%mode%"
    - "&#9CA3AFТип существа: &#4ADE80%type%"

# =========================================
# Настройки голограммы спаунера
# =========================================
spawnable-status:
  - "&#4ADE80%type% Спавнер"
  - "&#9CA3AFМожно сломать с помощью %mode%"
  - "&#9CA3AFПрисядьте и нажмите ПКМ, чтобы открыть меню"
  - "%status%"

can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# Настройки голограммы моба
# =========================================
mob-remove-warning:
  - "&#F87171Этот моб будет удален"
  - "&#FFE066В течение %time% с, если не покинет зону."
  
# =========================================
# Настройки меню (GUI)
# =========================================
menu:
  title: "&#6B7280Панель управления спавнером"
  status:
    active: "&#4ADE80Активен ✔"
    inactive: "&#F87171Неактивен ✖"
    
  items:
    auto-slayer:
      name: "&#F59E0B&lАвтоубийца"
      lore:
        - "&#9CA3AFАвтоматически убивает мобов из спавнера."
        - "&#9CA3AFТакже включает Хранилище и Сбор опыта."
        - "&#9CA3AFСтатус: %status%"
        - ""
        - "&#F9FAFBЛКМ: &#FFE066Изменить режим"
      lore-auto:
        - "&#9CA3AFАвтоматически убивает мобов из спавнера."
        - "&#9CA3AFХранилище и Сбор опыта всегда включены."
        - "&#9CA3AFСтатус: %status%"
      lore-no-perm:
        - "&#9CA3AFАвтоматически убивает мобов из спавнера."
        - "&#9CA3AFСтатус: %status%"
        - ""
        - "&#F87171&lВЫ НЕ МОЖЕТЕ ИСПОЛЬЗОВАТЬ ЭТУ ФУНКЦИЮ"

    storage:
      name: "&#38BDF8&lХранилище"
      lore:
        - "&#9CA3AFПредметы, собранные Авто-убийцей, хранятся здесь."
        - "&#9CA3AFЗанято слотов: &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#F9FAFBКлик: &#FFE066Открыть хранилище"

    xp-vacuum:
      name: "&#4ADE80&lСборщик XP"
      click: "&#F9FAFBКлик: &#38BDF8Забрать опыт"
      lore:
        - "&#9CA3AFХранит XP, выпадающий с убитых мобов."
        - ""
        - "&#9CA3AFСтатус: %status%"
        - "&#9CA3AFСобрано: &#FFE066%xp% XP"
        - ""
        - "&#F9FAFBЛКМ: &#FFE066Изменить режим"
        - "&#F9FAFBПКМ: &#38BDF8Забрать XP"
      lore-no-perm:
        - "&#9CA3AFХранит XP, выпадающий с убитых мобов."
        - ""
        - "&#9CA3AFСтатус: %status%"
        - "&#9CA3AFСобрано: &#FFE066%xp% XP"
        - ""
        - "&#F87171&lВЫ НЕ МОЖЕТЕ ИСПОЛЬЗОВАТЬ ЭТУ ФУНКЦИЮ"

  messages:
    no-permission: "&#F87171У вас нет прав на изменение этой функции!"
    xp-empty: "&#F87171Бак XP пуст!"
    xp-collected: "&#4ADE80Собрано: &#4ADE80%xp% XP!"
    req-auto-slayer: "&#F87171Сначала включите автоубийцу!"
    feature-no-perm: "&#F87171У вас нет прав на изменение этой функции!"
    perms-changed: "&#F87171Функции спавнера были отключены из-за изменения ваших прав."
    storage-inventory-full: "&#F87171Ваш инвентарь заполнен!"
    storage-taken: "&#4ADE80Взято предметов из хранилища: %amount%."
    in-use: "&#F87171Меню этого спавнера сейчас использует другой игрок."
  storage:
    title: "&#6B7280Хранилище спавнера"
    previous:
      name: "&#F9FAFB&lПредыдущая страница"
      lore:
        - "&#9CA3AFПерейти на страницу &#FFE066%page%&#9CA3AF"
    next:
      name: "&#F9FAFB&lСледующая страница"
      lore:
        - "&#9CA3AFПерейти на страницу &#FFE066%page%&#9CA3AF"
    take-page:
      name: "&#4ADE80&lЗабрать страницу"
      lore:
        - "&#9CA3AFЗабирает все предметы с этой страницы."
        - "&#9CA3AFПредметы нельзя положить обратно."
    back:
      name: "&#F87171&lНазад"
      lore:
        - "&#9CA3AFВернуться в меню спавнера."
    info:
      name: "&#38BDF8&lИнформация о хранилище"
      lore:
        - "&#9CA3AFСтраница: &#FFE066%page%&#9CA3AF/&#FFE066%pages%"
        - "&#9CA3AFЗанято слотов: &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#9CA3AFНажмите на предмет, чтобы забрать его."
  
# =========================================
# Настройки улучшения спавнера
# =========================================
# Плейсхолдеры: %range% %delay% %xp% %duration% (%index% в заголовке информации)
booster:
  item:
    name: "&#F59E0B&lУлучшение спавнера"
    lore:
      - "&#9CA3AFНажмите ПКМ по спавнеру этим билетом, чтобы улучшить его."
      - "&#FFE066Радиус работы: &#F9FAFB+%range% блоков"
      - "&#FFE066Задержка спавна: &#F9FAFB-%delay% секунд"
      - "&#FFE066Опыт с мобов: &#F9FAFB+%xp%%"
      - "&#FFE066Длительность: &#F9FAFB%duration%"
  select:
    title: "&#6B7280Выбор спавнера"
    entry: "&#FFE066&lСпавнер #%index%"
    click: "&#F9FAFBКлик: &#FFE066Применить усилитель"
  time:
    unlimited: "Бессрочно"
    hour: "ч"
    minute: "мин"
    second: "с"
  info:
    name: "&#F59E0B&lАктивные улучшения"
    empty: "&#9CA3AFНет активных улучшений."
    entry-title: "&#FFE066&lУлучшение №%index%"

# =========================================
# Сообщения плагина
# =========================================
messages:
  no-permission: "&#F87171У вас нет прав для этой команды."
  reload-success: "&#4ADE80Конфигурация Spawner системы успешно перезагружена."
  wrong-subcommand: "&#FFE066Использование: /spsystem <reload|pickaxegive|givespawner|givebooster>"
  wrong-pickaxe-usage: "&#FFE066Использование: /spsystem pickaxegive <игрок> <1-1000>"
  usage-givespawner: "&#FFE066Использование: /spsystem givespawner <игрок> <mob|item> <type> [amount]"
  usage-givebooster:
    - "&#FFE066Использование: /spsystem givebooster <игрок> <range> <delay-seconds> <xp-percent> <minutes|unlimited> [amount]"
    - "&#9CA3AF- &#F9FAFBrange&#9CA3AF: дополнительные блоки к радиусу активации спавнера"
    - "&#9CA3AF- &#F9FAFBdelay-seconds&#9CA3AF: секунды, вычитаемые из задержки спавна (0 = нет)"
    - "&#9CA3AF- &#F9FAFBxp-percent&#9CA3AF: дополнительный процент опыта от спавнера (0 = нет)"
    - "&#9CA3AF- &#F9FAFBminutes|unlimited&#9CA3AF: длительность буста в минутах или unlimited"
    - "&#9CA3AF- &#F9FAFBamount&#9CA3AF: сколько билетов выдать (необязательно)"
    - "&#FFE066Пример: &#F9FAFB/spsystem givebooster игрок 10 5 50 30 &#9CA3AF(+10 блоков, -5 с задержки, +50% опыта, 30 минут)"
  invalid-mob-type: "&#F87171Неверный тип моба: %type%"
  invalid-item-spawner: "&#F87171Неверный спавнер предметов: %type%"
