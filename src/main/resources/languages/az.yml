      - "&#FFE066Mob XP: &#F9FAFB+%xp%%"
      - "&#FFE066Müddət: &#F9FAFB%duration%"
  select:
    title: "&#6B7280Spawner seç"
    entry: "&#FFE066&lSpawner #%index%"
    click: "&#F9FAFBKlik: &#FFE066Booster tətbiq et"
