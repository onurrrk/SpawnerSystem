# ===============================
# Spawner System Magyar
# ===============================

# Prefix minden plugin üzenethez
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# Spawner csákány beállítások
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&lSpawner Csákány"
  lore:
    - "&#9CA3AFHasználd ezt a csákányt a spawner megtöréséhez."
    - "&#FFE066"
    - "&#4ADE80Maradék használat: &#F87171%uses%"

# =========================================
# Mód címkék (Fejlett vagy Klasszikus)
# =========================================
mode-tags:
  advanced: "Spawner Csákány"
  classic: "Selyem Tapintás Csákány"

# =========================================
# Spawner tárgy beállítások
# =========================================
spawner-item:
  name: "&#4ADE80%type% Spawner"
  lore:
    - "&#9CA3AFEzzel a spawnerrel mobokat hozhatsz létre."
    - "&#9CA3AFCsak a következővel törhető: &#FFE066%mode%"
    - "&#9CA3AFEntity típus: &#4ADE80%type%"

# =========================================
# Spawner hologram beállítások
# =========================================
spawnable-status:
  - "&#4ADE80%type% Spawner"
  - "&#9CA3AFTörhető %mode% használatával"
  - "&#9CA3AFGuggolj és jobb klikk a menü megnyitásához"
  - "%status%"

can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# Mob Hologram Beállítások
# =========================================
mob-remove-warning:
  - "&#F87171Ez a mob eltávolításra kerül"
  - "&#FFE066%time% másodpercen belül, ha nem hagyja el a területet."
  
