# =========================================
# Spawner erősítő beállítások
# =========================================
# Helyőrzők: %range% %delay% %xp% %duration% (%index% az információs címben)
booster:
  item:
    name: "&#F59E0B&lSpawner erősítő"
    lore:
      - "&#9CA3AFKattints jobb gombbal egy spawnerre ezzel a jeggyel az erősítéshez."
      - "&#FFE066Hatótáv: &#F9FAFB+%range% blokk"
      - "&#FFE066Megjelenési idő: &#F9FAFB-%delay% másodperc"
      - "&#FFE066Mob XP: &#F9FAFB+%xp%%"
      - "&#FFE066Időtartam: &#F9FAFB%duration%"
  select:
    title: "&#6B7280Spawner kiválasztása"
    entry: "&#FFE066&lSpawner #%index%"
    click: "&#F9FAFBKattintás: &#FFE066Booster alkalmazása"
  time:
    unlimited: "Korlátlan"
    hour: "ó"
    minute: "p"
    second: "mp"
  info:
    name: "&#F59E0B&lAktív erősítések"
    empty: "&#9CA3AFNincs aktív erősítés."
    entry-title: "&#FFE066&lErősítés #%index%"

