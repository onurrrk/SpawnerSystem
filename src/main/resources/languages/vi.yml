# =========================================
# Cài đặt tăng cường Spawner
# =========================================
# Biến giữ chỗ: %range% %delay% %xp% %duration% (%index% trong tiêu đề thông tin)
booster:
  item:
    name: "&#F59E0B&lTăng cường Spawner"
    lore:
      - "&#9CA3AFNhấp chuột phải vào spawner bằng vé này để tăng cường."
      - "&#FFE066Phạm vi hoạt động: &#F9FAFB+%range% khối"
      - "&#FFE066Thời gian sinh: &#F9FAFB-%delay% giây"
      - "&#FFE066XP quái: &#F9FAFB+%xp%%"
      - "&#FFE066Thời lượng: &#F9FAFB%duration%"
  select:
    title: "&#6B7280Chọn spawner"
    entry: "&#FFE066&lSpawner #%index%"
    click: "&#F9FAFBNhấp: &#FFE066Áp dụng booster"
  time:
    unlimited: "Không giới hạn"
    hour: "giờ"
    minute: "phút"
    second: "giây"
  info:
    name: "&#F59E0B&lTăng cường đang hoạt động"
    empty: "&#9CA3AFKhông có tăng cường nào đang hoạt động."
    entry-title: "&#FFE066&lTăng cường #%index%"

