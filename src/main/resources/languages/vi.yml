# ===============================
# Tập Tin Ngôn Ngữ Hệ Thống Spawner
# ===============================

# Tiền tố cho tất cả thông báo của plugin
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# Cài Đặt Vật Phẩm Cúp Spawner
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&lCúp Phá Spawner"
  lore:
    - "&#9CA3AFDùng cúp này để phá spawner."
    - "&#FFE066"
    - "&#4ADE80Số lần dùng còn lại: &#F87171%uses%"

# =========================================
# Thẻ Chế Độ (Nâng Cao hoặc Cổ Điển)
# =========================================
mode-tags:
  advanced: "Cúp Phá Spawner"
  classic: "Cúp có Phù Phép Silk Touch"

# =========================================
# Cài Đặt Vật Phẩm Spawner
# =========================================
spawner-item:
  name: "&#4ADE80Spawner %type%"
  lore:
    - "&#9CA3AFĐặt spawer này để spawn"
    - "&#9CA3AFCó thể phá bằng: &#FFE066%mode%"
    - "&#9CA3AFLoại sinh vật: &#4ADE80%type%"

# =========================================
# Cài Đặt Hologram Spawner
# =========================================
spawnable-status:
  - "&#4ADE80Spawner %type%"
  - "&#9CA3AFCó thể phá bằng %mode%"
  - "&#9CA3AFCúi xuống và nhấp chuột phải để mở menu"
  - "%status%"

can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# Cài Đặt Hologram Mob
# =========================================
mob-remove-warning:
  - "&#F87171Mob này sẽ bị xóa"
  - "&#FFE066Trong vòng %time% giây nếu không rời khỏi khu vực."
  
