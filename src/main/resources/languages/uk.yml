# ===============================
# Мовний файл системи споунерів
# ===============================

# Префікс для всіх повідомлень плагіна
prefix: "&8[&#38BDF8Spawner&#7DD3FCSystem&8] &r"

# =========================================
# Налаштування предмету - Кайло Споунерів
# =========================================
spawner-pickaxe-item:
  name: "&#38BDF8&lКайло Споунерів"
  lore:
    - "&#9CA3AFВикористовуйте це кайло, щоб ламати споунери."
    - "&#FFE066"
    - "&#4ADE80Залишилося використань: &#F87171%uses%"

# =========================================
# Теги режимів (Розширений або Класичний)
# =========================================
mode-tags:
  advanced: "Кайло Споунерів"
  classic: "Кайло з Шовковим Дотиком"

# =========================================
# Налаштування предмету - Споунер
# =========================================
spawner-item:
  name: "&#4ADE80Споунер %type%"
  lore:
    - "&#9CA3AFПоставте цей споунер, щоб спавнити"
    - "&#9CA3AFМожна зламати за допомогою: &#FFE066%mode%"
    - "&#9CA3AFТип істоти: &#4ADE80%type%"

# =========================================
# Налаштування голограми споунера
# =========================================
spawnable-status:
  - "&#4ADE80Споунер %type%"
  - "&#9CA3AFМожна зламати за допомогою %mode%"
  - "&#9CA3AFПрисядьте і клацніть правою кнопкою, щоб відкрити меню"
  - "%status%"
  
can_spawn: "&#4ADE80(✓)"
cannot_spawn: "&#F87171(!)"

# =========================================
# Налаштування голограми моба
# =========================================
mob-remove-warning:
  - "&#F87171Цей моб буде видалено"
  - "&#FFE066Протягом %time% с, якщо не залишить зону."
  
# =========================================
# Налаштування меню (GUI)
# =========================================
menu:
  title: "&#6B7280Панель керування спавнером"
  status:
    active: "&#4ADE80Активний ✔"
    inactive: "&#F87171Неактивний ✖"
    
  items:
    auto-slayer:
      name: "&#F59E0B&lАвтовбивця"
      lore:
        - "&#9CA3AFАвтоматично вбиває мобів зі спавнера."
        - "&#9CA3AFТакож вмикає Сховище та Збирач досвіду."
        - "&#9CA3AFСтатус: %status%"
        - ""
        - "&#F9FAFBЛКМ: &#FFE066Змінити режим"
      lore-auto:
        - "&#9CA3AFАвтоматично вбиває мобів зі спавнера."
        - "&#9CA3AFСховище та Збирач досвіду завжди ввімкнені."
        - "&#9CA3AFСтатус: %status%"
      lore-no-perm:
        - "&#9CA3AFАвтоматично вбиває мобів зі спавнера."
        - "&#9CA3AFСтатус: %status%"
        - ""
        - "&#F87171&lВИ НЕ МОЖЕТЕ ВИКОРИСТОВУВАТИ ЦЮ ФУНКЦІЮ"

    storage:
      name: "&#38BDF8&lСховище"
      lore:
        - "&#9CA3AFПредмети, зібрані Авто-вбивцею, зберігаються тут."
        - "&#9CA3AFЗайнято слотів: &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#F9FAFBКлік: &#FFE066Відкрити сховище"

    xp-vacuum:
      name: "&#4ADE80&lЗбирач XP"
      click: "&#F9FAFBКлік: &#38BDF8Забрати досвід"
      lore:
        - "&#9CA3AFЗберігає XP, що випадає з убитих мобів."
        - ""
        - "&#9CA3AFСтатус: %status%"
        - "&#9CA3AFЗібрано: &#FFE066%xp% XP"
        - ""
        - "&#F9FAFBЛКМ: &#FFE066Змінити режим"
        - "&#F9FAFBПКМ: &#38BDF8Забрати XP"
      lore-no-perm:
        - "&#9CA3AFЗберігає XP, що випадає з убитих мобів."
        - ""
        - "&#9CA3AFСтатус: %status%"
        - "&#9CA3AFЗібрано: &#FFE066%xp% XP"
        - ""
        - "&#F87171&lВИ НЕ МОЖЕТЕ ВИКОРИСТОВУВАТИ ЦЮ ФУНКЦІЮ"

  messages:
    no-permission: "&#F87171У вас немає прав змінювати цю функцію!"
    xp-empty: "&#F87171Бак XP порожній!"
    xp-collected: "&#4ADE80Зібрано: &#4ADE80%xp% XP!"
    req-auto-slayer: "&#F87171Спочатку ввімкніть автовбивцю!"
    feature-no-perm: "&#F87171У вас немає прав змінювати цю функцію!"
    perms-changed: "&#F87171Функції спавнера було вимкнено через зміну ваших прав."
    storage-inventory-full: "&#F87171Ваш інвентар заповнений!"
    storage-taken: "&#4ADE80Взято предметів зі сховища: %amount%."
    in-use: "&#F87171Меню цього спавнера зараз використовує інший гравець."
  storage:
    title: "&#6B7280Сховище спавнера"
    previous:
      name: "&#F9FAFB&lПопередня сторінка"
      lore:
        - "&#9CA3AFПерейти на сторінку &#FFE066%page%&#9CA3AF"
    next:
      name: "&#F9FAFB&lНаступна сторінка"
      lore:
        - "&#9CA3AFПерейти на сторінку &#FFE066%page%&#9CA3AF"
    take-page:
      name: "&#4ADE80&lЗабрати сторінку"
      lore:
        - "&#9CA3AFЗабирає всі предмети з цієї сторінки."
        - "&#9CA3AFПредмети не можна покласти назад."
    back:
      name: "&#F87171&lНазад"
      lore:
        - "&#9CA3AFПовернутися до меню спавнера."
    info:
      name: "&#38BDF8&lІнформація про сховище"
      lore:
        - "&#9CA3AFСторінка: &#FFE066%page%&#9CA3AF/&#FFE066%pages%"
        - "&#9CA3AFЗайнято слотів: &#FFE066%used%&#9CA3AF/&#FFE066%max%"
        - ""
        - "&#9CA3AFНатисніть на предмет, щоб забрати його."
  
# =========================================
# Налаштування посилення спавнера
# =========================================
# Плейсхолдери: %range% %delay% %xp% %duration% (%index% у заголовку інформації)
booster:
  item:
    name: "&#F59E0B&lПосилення спавнера"
    lore:
      - "&#9CA3AFНатисніть ПКМ по спавнеру цим квитком, щоб посилити його."
      - "&#FFE066Радіус роботи: &#F9FAFB+%range% блоків"
      - "&#FFE066Затримка спавну: &#F9FAFB-%delay% секунд"
      - "&#FFE066Досвід з мобів: &#F9FAFB+%xp%%"
      - "&#FFE066Тривалість: &#F9FAFB%duration%"
  select:
    title: "&#6B7280Вибір спавнера"
    entry: "&#FFE066&lСпавнер #%index%"
    click: "&#F9FAFBКлік: &#FFE066Застосувати підсилювач"
  time:
    unlimited: "Безстроково"
    hour: "год"
    minute: "хв"
    second: "с"
  info:
    name: "&#F59E0B&lАктивні посилення"
    empty: "&#9CA3AFНемає активних посилень."
    entry-title: "&#FFE066&lПосилення №%index%"

